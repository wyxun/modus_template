# MFOC test macros for MStudio
# Load this file as the MStudio macro list.
#
# Encoder + EKF shadow test:
#   align -> speed_0.4 -> inspect Enc/EKF/Err/Iq waveform -> stop
#
# Sensorless test:
#   build with MFOC_FEEDBACK_BACKEND=MFOC_FEEDBACK_EKF, then run
#   sensorless_0.4_0.05. The current encoder backend rejects this command.
#
# HFI commands require MFOC_FEEDBACK_ENABLE_HFI=1.
# Flux status requires MFOC_FEEDBACK_ENABLE_FLUX=1.

status = motor status
align = motor align
encoder = motor encoder
current_0_0.02 = motor current 0 0.02
speed_0.2 = motor speed 0.2
speed_0.4 = motor speed 0.4
openloop_0.2_0.04 = motor openloop 0.2 0.04
openloop_0.3_0.04 = motor openloop 0.3 0.04
sensorless_0.4_0.05 = motor sensorless 0.4 0.05
hfi_start = motor hfi start
hfi_status = motor hfi status
flux_status = motor flux status
stop = motor stop
clear = motor clear
isr_timing_toggle = log -T
wave_start = wave start
wave_stop = wave stop
